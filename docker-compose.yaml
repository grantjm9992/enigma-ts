version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: nestjs-mongodb
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: nestjs_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - nestjs-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestjs-api
    restart: always
    ports:
      - '3000:3000'
    environment:
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/nestjs_db?authSource=admin
      - PORT=3000
    depends_on:
      - mongodb
    volumes:
      - ./src:/app/src
      - /app/node_modules
    networks:
      - nestjs-network

volumes:
  mongodb_data:

networks:
  nestjs-network:
    driver: bridge
